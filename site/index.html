<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>同题异答 · 模型前端效果对比</title>
  <meta name="description" content="同一份提示词，不同模型的前端表达。浏览作品、并排体验、查看截图与源码。" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f7f7f8" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close icon-btn" data-lb="close" aria-label="关闭（Esc）">✕</button>
    <button class="lb-nav lb-prev icon-btn" data-lb="prev" aria-label="上一张（←）">‹</button>
    <figure class="lb-figure">
      <img class="lb-img" alt="" />
      <figcaption class="lb-caption"></figcaption>
    </figure>
    <button class="lb-nav lb-next icon-btn" data-lb="next" aria-label="下一张（→）">›</button>
  </div>
  <noscript>此页面需要启用 JavaScript。</noscript>
  <script type="module" src="app.js"></script>

</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>古城 · 体素中式建筑群 | Voxel Chinese Courtyard</title>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: rgba(20, 20, 23, 0.72);
    --border: rgba(255, 255, 255, 0.10);
    --text: #ededf0;
    --dim: #8b8b95;
    --accent: #e8b53a;
    --accent-2: #7fd1c0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed;
    left: 18px;
    top: 18px;
    z-index: 10;
    min-width: 232px;
    padding: 14px 16px 13px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    user-select: none;
  }
  .hud h1 {
    margin: 0 0 2px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  .hud .sub {
    font-size: 10.5px;
    color: var(--dim);
    letter-spacing: 0.10em;
    text-transform: uppercase;
    margin-bottom: 11px;
  }
  .stats {
    display: flex;
    gap: 16px;
    padding: 9px 0 11px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 11px;
  }
  .stat { display: flex; flex-direction: column; gap: 3px; }
  .stat .k { font-size: 9.5px; color: var(--dim); letter-spacing: 0.10em; text-transform: uppercase; }
  .stat .v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .v em { font-style: normal; font-size: 10px; color: var(--dim); font-weight: 400; margin-left: 2px; }

  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .lbl {
    font-size: 9.5px; color: var(--dim); letter-spacing: 0.10em;
    text-transform: uppercase; margin: 0 0 6px;
  }
  button {
    flex: 1;
    appearance: none;
    padding: 7px 4px;
    font: inherit;
    font-size: 11.5px;
    color: var(--text);
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.16s, border-color 0.16s, color 0.16s;
    white-space: nowrap;
  }
  button:hover { background: rgba(255, 255, 255, 0.10); }
  button.on {
    background: rgba(232, 181, 58, 0.16);
    border-color: rgba(232, 181, 58, 0.55);
    color: var(--accent);
  }

  .hint {
    position: fixed;
    right: 18px;
    bottom: 16px;
    z-index: 10;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.42);
    letter-spacing: 0.05em;
    text-align: right;
    line-height: 1.7;
    pointer-events: none;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
  }

  /* ---------- loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    background: radial-gradient(circle at 50% 42%, #1a1a1f 0%, #0d0d0f 70%);
    transition: opacity 0.7s ease 0.15s, visibility 0.7s ease 0.15s;
  }
  #loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #loader .ttl { font-size: 15px; letter-spacing: 0.30em; color: #d8d8de; }
  #loader .bar { width: 190px; height: 2px; background: rgba(255,255,255,0.10); overflow: hidden; border-radius: 2px; }
  #loader .bar i {
    display: block; height: 100%; width: 40%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: sweep 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }
  #loader .msg { font-size: 11px; color: var(--dim); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
  @keyframes sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }

  @media (max-width: 640px) {
    .hud { left: 10px; top: 10px; min-width: 0; padding: 11px 12px; transform-origin: top left; }
    .hint { display: none; }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="hud">
    <h1>古城 · 体素中式建筑群</h1>
    <div class="sub">Voxel Chinese Courtyard</div>

    <div class="stats">
      <div class="stat"><span class="k">Voxels</span><span class="v" id="s-vox">—</span></div>
      <div class="stat"><span class="k">FPS</span><span class="v" id="s-fps">—</span></div>
      <div class="stat"><span class="k">Build</span><span class="v" id="s-ms">—<em>ms</em></span></div>
    </div>

    <p class="lbl">时段 · Time</p>
    <div class="row" id="row-time">
      <button data-time="dawn" class="on">晨曦</button>
      <button data-time="noon">正午</button>
      <button data-time="dusk">黄昏</button>
    </div>

    <p class="lbl">机位 · Camera</p>
    <div class="row" id="row-view">
      <button data-view="panorama" class="on">全景</button>
      <button data-view="axis">中轴</button>
      <button data-view="top">俯瞰</button>
    </div>
    <div class="row">
      <button data-view="hall">主殿</button>
      <button data-view="pagoda">宝塔</button>
      <button id="btn-spin" class="on">旋转</button>
    </div>
  </div>

  <div class="hint">
    拖拽旋转 · 滚轮缩放 · 右键平移<br />
    5 座以上建筑 · 中轴对称院落
  </div>

  <div id="loader">
    <div class="ttl">古 城</div>
    <div class="bar"><i></i></div>
    <div class="msg" id="loader-msg">initializing…</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

  <body>
    <div id="stage"></div>

      <div class="hud-card">

          <span class="hud-name">青溪镇</span>
          <span class="hud-sub">桌面微缩铁路沙盘</span>

        <div class="hud-row">
          <button id="btn-play" class="btn btn-primary" type="button">⏸ 暂停</button>

          <label for="speed-range">速度</label>

        <div class="hud-status" id="hud-status">运行中 · 白天 · 1.00×</div>

        <div class="loading-title">正在搭建沙盘…</div>
        <div class="loading-bar"><span id="loading-fill"></span></div>

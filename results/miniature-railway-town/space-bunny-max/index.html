<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>桌面微缩铁路小镇 · Three.js</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232a1f18'/%3E%3Crect x='4' y='19' width='24' height='4' fill='%238a8378'/%3E%3Crect x='7' y='11' width='7' height='7' fill='%23e6d8bd'/%3E%3Cpath d='M7 11 L18 5 L18 11 Z' fill='%239a5a45'/%3E%3Crect x='19' y='13' width='5' height='5' fill='%23c9c2b2'/%3E%3C/svg%3E" />
<meta name="description" content="Three.js 等距桌面沙盘：闭合铁路、跨河桥梁、傍晚暖阳与昼夜切换" />
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <header class="plate">
      <h1>桌面微缩铁路小镇</h1>
      <p>Three.js 等距沙盘 · <span id="stat-fps">--</span> fps</p>
    </header>

    <section class="panel" id="panel">
      <div class="row">
        <button id="btn-run" class="btn btn--primary" type="button">
          <span class="btn__ico" id="run-ico">❚❚</span><span id="run-label">暂停</span>
        </button>
        <button id="btn-reset" class="btn" type="button">
          <span class="btn__ico">↺</span><span>复位</span>
        </button>
      </div>

      <div class="field">
        <div class="field__top"><span>运行速度</span><b id="speed-val">1.00×</b></div>
        <input id="speed" type="range" min="0.25" max="3" step="0.05" value="1" aria-label="运行速度" />
      </div>

      <div class="field">
        <div class="field__top"><span>光照</span><b id="mode-val">傍晚</b></div>
        <div class="seg" id="seg-time" role="group" aria-label="昼夜切换">
          <button class="seg__btn is-on" data-mode="dusk" type="button">傍晚</button>
          <button class="seg__btn" data-mode="day" type="button">白天</button>
          <button class="seg__btn" data-mode="night" type="button">夜晚</button>
        </div>
      </div>

      <div class="readout" id="readout">正在初始化…</div>
      <p class="hint">左键拖拽旋转 · 滚轮缩放 · 右键平移<br />空格 运行/暂停 · R 复位 · N 昼夜</p>
    </section>

    <div class="loader" id="loader">
      <div class="loader__ring"></div>
      <p>正在搭建沙盘…</p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head><script src="../../../sandtable-bridge.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="可交互的 Three.js 桌面微缩铁路小镇：环形铁路、车站、河流、桥梁与昼夜照明。"
    />
    <meta name="theme-color" content="#171815" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>溪谷镇 · 桌面微缩铁路</title>
    <script type="module" crossorigin src="./assets/index-DzYuiUF_.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CqkNBFYK.css">
  </head>
  <body>
    <main id="app" aria-label="溪谷镇微缩铁路互动沙盘">
      <div id="scene" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand-card glass-panel">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div>
            <p class="eyebrow">HOLLOWBROOK · H0 1:87</p>
            <h1>溪谷镇铁路</h1>
          </div>
        </div>

        <div class="view-hint glass-panel" aria-label="视角操作提示">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20M12 2l-3 3m3-3 3 3M22 12l-3-3m3 3-3 3M12 22l3-3m-3 3-3-3M2 12l3 3m-3-3 3-3"/></svg>
          <span>拖拽旋转 · 滚轮缩放</span>
        </div>
      </header>

      <section class="station-card glass-panel" aria-live="polite">
        <div class="signal" aria-hidden="true"><span></span></div>
        <div>
          <p class="eyebrow">下一站</p>
          <strong id="stationStatus">驶向溪谷站</strong>
        </div>
        <div class="trip-distance" id="tripDistance">—</div>
      </section>

      <section class="control-dock glass-panel" aria-label="铁路控制台">
        <button id="playButton" class="primary-control" type="button" aria-label="暂停列车">
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M17 5v14"/></svg>
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
          <span id="playLabel">暂停</span>
        </button>

        <div class="divider" aria-hidden="true"></div>

        <label class="speed-control" for="speedRange">
          <span class="control-label">车速</span>
          <input id="speedRange" type="range" min="0.5" max="1.8" step="0.1" value="1" />
          <output id="speedValue" for="speedRange">1.0×</output>
        </label>

        <div class="divider optional-divider" aria-hidden="true"></div>

        <button id="timeButton" class="secondary-control" type="button" aria-label="切换到夜晚">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.7 8.7 0 0 1 9.8 3.5 8.7 8.7 0 1 0 20.5 14.2Z"/></svg>
          <span id="timeLabel">夜晚</span>
        </button>

        <button id="resetButton" class="icon-control" type="button" aria-label="复位沙盘">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.5 15.5A8 8 0 1 0 6 7.4L4 10"/></svg>
          <span>复位</span>
        </button>
      </section>

      <div class="scale-note">手工微缩景观 · 比例 1:87</div>

      <div id="loadingScreen" class="loading-screen">
        <div class="loader-track"><div class="loader-train"></div></div>
        <p>正在布置溪谷镇…</p>
      </div>
    </main>
  </body>
</html>

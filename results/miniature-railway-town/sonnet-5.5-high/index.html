<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌面微缩铁路小镇</title>
  <script type="module" crossorigin src="./assets/index-CRuD_3hB.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Clz7pNes.css">
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <header class="title">
    <h1>微缩铁路小镇</h1>
    <p>Miniature Railway Town · 桌面沙盘</p>
  </header>

  <aside class="panel" id="panel">
    <div class="row">
      <button id="btn-run" class="btn primary" title="运行 / 暂停 (空格)">⏸ 暂停</button>
      <button id="btn-reset" class="btn" title="复位 (R)">↺ 复位</button>
    </div>
    <div class="row col">
      <label for="speed">列车速度 <output id="speed-out">1.0×</output></label>
      <input id="speed" type="range" min="0.25" max="3" step="0.05" value="1" />
    </div>
    <div class="row">
      <button id="btn-night" class="btn wide" title="白天 / 夜晚 (N)">🌙 切换到夜晚</button>
    </div>
    <div class="status" id="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">运行中</span>
    </div>
    <div class="hint">左键旋转 · 滚轮缩放 · 右键平移<br />空格 运行/暂停 · R 复位 · N 昼夜</div>
  </aside>

  <div class="loading" id="loading">正在搭建沙盘…</div>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>同题异答 · 模型前端效果对比</title>
  <meta name="description" content="同一份提示词交给不同模型，对比它们生成的可运行前端页面：在线运行、截图对照、查看源码。" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23b33a26'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='serif'>同</text></svg>" />

<body>
  <div id="app" aria-live="polite"></div>
  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close icon-btn" data-lb="close" aria-label="关闭（Esc）">✕</button>

    <figure class="lb-figure">
      <img class="lb-img" alt="" />

    </figure>
    <button class="lb-nav lb-next icon-btn" data-lb="next" aria-label="下一张（→）">›</button>
  </div>

  <script type="module" src="app.js"></script>

</html>

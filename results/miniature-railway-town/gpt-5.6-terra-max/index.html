<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e7a66f" />
    <title>暮光微缩铁路镇</title>
    <script type="module" crossorigin src="./assets/index-DJSjx0c8.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D3MD4M7X.css">
  </head>
  <body>
    <main id="app" aria-label="可交互的微缩铁路小镇沙盘">
      <section class="title-card" aria-label="场景说明">
        <p class="eyebrow">TABLETOP MINIATURE</p>
        <h1>暮光铁路镇</h1>
        <p class="subtitle">Pine Ridge &middot; 一座会呼吸的桌面沙盘</p>
      </section>

      <section class="control-panel" aria-label="列车控制">
        <div class="panel-topline">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="train-status">运行中</span>
        </div>
        <div class="control-row">
          <button id="toggle-train" class="primary-control" type="button">暂停列车</button>
          <button id="reset-scene" type="button">复位</button>
        </div>
        <label class="speed-control" for="speed-slider">
          <span>行驶速度</span>
          <strong id="speed-value">1.0×</strong>
          <input id="speed-slider" type="range" min="0.5" max="2.5" value="1" step="0.1" />
        </label>
        <button id="toggle-time" class="time-control" type="button">切换至夜晚</button>
      </section>

      <p class="view-tip">拖拽旋转视角 &nbsp;·&nbsp; 滚轮缩放 &nbsp;·&nbsp; 列车抵站停靠约 2 秒</p>
    </main>
  </body>
</html>

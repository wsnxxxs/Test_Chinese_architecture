<!DOCTYPE html>
<html lang="zh-CN">
  <head><script src="../../../sandtable-bridge.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微缩铁路小镇 · Miniature Railway Town</title>

  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="panel" class="panel">
        <div class="panel-head">
          <h1>微缩铁路小镇</h1>
          <span class="sub">Miniature Railway Town</span>
        </div>

        <div class="row">
          <button id="btn-run" class="btn primary" title="运行 / 暂停 (空格)">⏸ 暂停</button>
          <button id="btn-reset" class="btn" title="复位 (R)">⟲ 复位</button>
        </div>

        <div class="row">
          <button id="btn-time" class="btn wide" title="白天 / 夜晚 (N)">🌆 傍晚 → 夜晚</button>
        </div>

        <label class="slider-row" for="speed">
          <span>车速</span>
          <input id="speed" type="range" min="0.25" max="3" step="0.05" value="1" />
          <output id="speed-out">1.00×</output>
        </label>

        <div class="status">
          <span id="status-state">运行中</span>
          <span id="status-fps">– fps</span>
        </div>

        <div class="hint">
          拖动旋转 · 滚轮 / 双指缩放 · 右键拖动平移<br />
          空格 运行/暂停 · R 复位 · N 白天/夜晚
        </div>
      </div>

      <div id="loading" class="loading">
        <div class="loading-box">
          <div class="spinner"></div>
          <p>正在搭建沙盘…</p>
        </div>
      </div>
    </div>

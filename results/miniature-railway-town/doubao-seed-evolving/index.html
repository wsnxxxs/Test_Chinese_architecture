<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面微缩铁路小镇</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1b1a18; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      .panel {
        position: fixed;
        top: 18px;
        left: 18px;
        width: 268px;
        padding: 16px 16px 14px;
        color: #f3ece0;
        background: rgba(24, 22, 20, 0.72);
        border: 1px solid rgba(255, 220, 170, 0.18);
        border-radius: 14px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,.35);
        user-select: none;
      }
      .panel h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 1px;
        margin-bottom: 3px;
      }
      .panel .sub {
        font-size: 11px;
        color: #b7ab98;
        margin-bottom: 12px;
      }
      .row { display: flex; gap: 8px; margin-bottom: 10px; }
      button {
        flex: 1;
        padding: 8px 6px;
        font-size: 13px;
        color: #f6ecdd;
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,220,170,.22);
        border-radius: 9px;
        cursor: pointer;
        transition: background .15s;
      }
      button:hover { background: rgba(232,161,90,.35); }
      button:active { background: rgba(232,161,90,.55); }
      label.slider { display: block; font-size: 12px; color: #cdbfaa; margin-bottom: 4px; }
      label.slider span { float: right; color: #f0c98c; }
      input[type="range"] {
        width: 100%;
        accent-color: #e8a15a;
        margin-bottom: 12px;
      }
      .status {
        font-size: 12px;
        line-height: 1.7;
        color: #d8ccb8;
        padding-top: 9px;
        border-top: 1px dashed rgba(255,220,170,.2);
      }
      .status b { color: #ffcf8f; font-weight: 600; }
      .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#7fd18a; margin-right:5px; }
      .dot.paused { background:#e0a35a; }
      .dot.stop { background:#e0705a; }

      .hint {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        padding: 7px 16px;
        font-size: 12px;
        color: #e6dccb;
        background: rgba(24,22,20,.62);
        border: 1px solid rgba(255,220,170,.14);
        border-radius: 999px;
        backdrop-filter: blur(8px);
        user-select: none;
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Ck3fktCU.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <div class="panel">
      <h1>桌面微缩铁路小镇</h1>
      <div class="sub">Miniature Railway Town · Three.js</div>
      <div class="row">
        <button id="btnPlay">暂停</button>
        <button id="btnMode">切到白天</button>
        <button id="btnReset">复位</button>
      </div>
      <label class="slider">车速 <span id="speedVal">1.0×</span></label>
      <input id="speed" type="range" min="0.3" max="2" step="0.1" value="1" />
      <div class="status">
        <div><span id="stateDot" class="dot"></span><span id="stateText">运行中</span></div>
        <div id="timerText">距到站 -- s</div>
        <div id="modeText">光照：傍晚</div>
      </div>
    </div>

    <div class="hint">鼠标左键拖动旋转 · 滚轮缩放 · 右键平移 · 空格暂停</div>

  </body>
</html>

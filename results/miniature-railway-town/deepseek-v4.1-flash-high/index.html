<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>桌面微缩铁路小镇</title>
    <style>
      :root {
        --text: #e9eef7;
        --text-dim: #a3b2c8;
        --accent: #ffb46b;
        --accent-deep: #f0a24f;
        --glass: rgba(17, 22, 31, 0.66);
        --glass-strong: rgba(14, 18, 26, 0.82);
        --glass-line: rgba(255, 255, 255, 0.14);
        --glass-line-hi: rgba(255, 255, 255, 0.32);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #080b11;
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* --- 覆盖层文字：不吃指针事件，保证沙盘拖拽/缩放手感 --- */
      .hud {
        position: fixed;
        pointer-events: none;
        z-index: 6;
        user-select: none;
      }

      .hud--title {
        top: 14px;
        left: 16px;
        padding: 10px 14px;
        border-radius: var(--radius);
        background: var(--glass);
        border: 1px solid var(--glass-line);
        backdrop-filter: blur(12px) saturate(140%);
        -webkit-backdrop-filter: blur(12px) saturate(140%);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      .hud--title h1 {
        margin: 0;
        font-size: 17px;
        line-height: 1.2;
        font-weight: 650;
        letter-spacing: 0.04em;
      }

      .hud--title p {
        margin: 4px 0 0;
        font-size: 11px;
        color: var(--text-dim);
        letter-spacing: 0.08em;
      }

      .hud--hint {
        right: 16px;
        bottom: 16px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--glass);
        border: 1px solid var(--glass-line);
        backdrop-filter: blur(12px) saturate(140%);
        -webkit-backdrop-filter: blur(12px) saturate(140%);
        font-size: 12px;
        color: var(--text-dim);
        white-space: nowrap;
      }

      /* --- 控制面板容器 --- */
      #ui {
        position: fixed;
        left: 16px;
        bottom: 16px;
        width: 264px;
        z-index: 8;
      }

      .panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 12px;
        border-radius: var(--radius);
        background: var(--glass-strong);
        border: 1px solid var(--glass-line);
        backdrop-filter: blur(16px) saturate(140%);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.46);
        font-size: 12px;
      }

      .panel__head {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .panel__title {
        font-size: 12px;
        letter-spacing: 0.16em;
        color: var(--text-dim);
      }

      .panel__status {
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.06em;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--glass-line);
        color: var(--text-dim);
        transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .panel__status.is-running {
        color: #9ce6b0;
        border-color: rgba(156, 230, 176, 0.34);
      }

      .panel__status.is-paused {
        color: #ffcf8a;
        border-color: rgba(255, 207, 138, 0.4);
        background: rgba(255, 180, 107, 0.12);
      }

      .panel__status.is-stopped {
        color: #8ec8ff;
        border-color: rgba(142, 200, 255, 0.36);
      }

      .panel__row {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
      }

      .panel__field {
        grid-column: 1 / -1;
        display: grid;
        gap: 5px;
      }

      .panel__label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        color: var(--text-dim);
        letter-spacing: 0.06em;
      }

      .panel__value {
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }

      .panel__sub {
        color: rgba(163, 178, 200, 0.75);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      /* --- 按钮：默认 / 悬停 / 按下 / 激活 --- */
      .btn {
        flex: 1;
        appearance: none;
        font: inherit;
        font-size: 12px;
        color: var(--text);
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--glass-line);
        background: rgba(255, 255, 255, 0.06);
        cursor: pointer;
        transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease,
          transform 0.08s ease;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.13);
        border-color: var(--glass-line-hi);
      }

      .btn:active {
        transform: translateY(1px) scale(0.99);
        background: rgba(255, 255, 255, 0.2);
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .btn.is-active {
        background: linear-gradient(180deg, #ffcb92, var(--accent-deep));
        border-color: #ffd7a3;
        color: #2a1907;
        font-weight: 600;
      }

      .segmented {
        display: flex;
        gap: 4px;
        padding: 3px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .segmented .btn {
        padding: 6px 4px;
        background: transparent;
        border-color: transparent;
        color: var(--text-dim);
      }

      .segmented .btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
      }

      .segmented .btn.is-active {
        background: linear-gradient(180deg, #ffcb92, var(--accent-deep));
        border-color: #ffd7a3;
        color: #2a1907;
      }

      /* --- 自绘滑块 --- */
      .slider {
        --fill: 50%;
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 20px;
        margin: 0;
        background: transparent;
        cursor: pointer;
      }

      .slider::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          var(--accent) 0%,
          var(--accent) var(--fill),
          rgba(255, 255, 255, 0.16) var(--fill),
          rgba(255, 255, 255, 0.16) 100%
        );
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 15px;
        height: 15px;
        margin-top: -4.5px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid var(--accent);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
        transition: transform 0.12s ease;
      }

      .slider:hover::-webkit-slider-thumb {
        transform: scale(1.12);
      }

      .slider:active::-webkit-slider-thumb {
        transform: scale(1.22);
      }

      .slider::-moz-range-track {
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
      }

      .slider::-moz-range-progress {
        height: 6px;
        border-radius: 999px;
        background: var(--accent);
      }

      .slider::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid var(--accent);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      }

      /* --- 加载遮罩 --- */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 100% at 50% 40%, #16202c 0%, #080b11 70%);
        transition: opacity 0.55s ease;
      }

      #loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader__box {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text-dim);
        font-size: 13px;
        letter-spacing: 0.14em;
      }

      .loader__spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-top-color: var(--accent);
        animation: loader-spin 0.9s linear infinite;
      }

      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* --- 窄屏：面板贴底铺开，避开画面中心 --- */
      @media (max-width: 720px) {
        #ui {
          left: 8px;
          right: 8px;
          bottom: 8px;
          width: auto;
        }

        .panel {
          gap: 8px;
          padding: 10px;
        }

        .hud--title {
          top: 10px;
          left: 10px;
          padding: 8px 11px;
        }

        .hud--title h1 {
          font-size: 14px;
        }

        .hud--title p {
          display: none;
        }

        .hud--hint {
          top: 10px;
          right: 10px;
          bottom: auto;
          max-width: 44vw;
          font-size: 11px;
          white-space: normal;
          text-align: right;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <header class="hud hud--title">
      <h1>桌面微缩铁路小镇</h1>
      <p>THREE.JS 沙盘 · 正交等距视角</p>
    </header>

    <div class="hud hud--hint">拖拽旋转 · 滚轮缩放 · 空格暂停 · R 复位</div>

    <div id="ui"></div>

    <div id="loader">
      <div class="loader__box">
        <span class="loader__spinner"></span>
        <span>正在布置小镇…</span>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面微缩铁路小镇</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui">
      <div class="title">微缩铁路小镇</div>
      <div class="row">
        <button id="btnRun">暂停</button>
        <button id="btnReset">复位</button>
        <button id="btnMode">夜晚</button>
      </div>
      <div class="row speed">
        <span>速度</span>
        <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" />
        <span id="speedVal">1.00×</span>
      </div>
      <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
